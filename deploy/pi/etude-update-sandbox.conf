# The sandbox of everything the root update helper does, in one list: deploy/pi/setup.sh fills in
# @PREFIX@ and @APP_HOME@ (the app user's home folder, which the backup and restore write in) and
# installs it as a drop-in of etude-update.service and of etude-update-resume.service. The helper's
# `sandboxed count | crashed | idle` (what the app units run before every start) reads the update
# service's copy and runs the same program as a transient service with these very properties
# (helper/sandbox.hpp), so a unit and a transient run cannot drift apart. The units carry no list of
# their own.
#
# The helper is root, and treats everything the app leaves as hostile; this keeps what it can touch
# to what an update has to change. Everything but the three folders below is read-only to it. The third
# is the app user's home and not its data folder: systemd follows a link when it sets up a writable
# path, the app owns its data folder and can turn it into a link (to /etc, or in a loop that ends the
# unit's set-up), but it cannot swap its home, whose parent is root's (setup.sh checks that).
# (A RuntimeMaxSec here would only shorten the helper's transient runs: the launcher ends them at its own
# limit, the worst case of the mode.)
[Service]
ProtectSystem=strict
ReadWritePaths=@PREFIX@ /var/lib/etude-update -@APP_HOME@
ProtectHome=read-only
PrivateTmp=yes
PrivateDevices=yes
NoNewPrivileges=yes
RestrictSUIDSGID=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProcSubset=pid
LockPersonality=yes
MemoryDenyWriteExecute=yes
RestrictRealtime=yes
RestrictNamespaces=yes
RestrictAddressFamilies=AF_UNIX
SystemCallArchitectures=native
SystemCallFilter=@system-service
# It reads and writes in the app's folder (DAC_OVERRIDE), becomes the app's user for the data
# (SETUID, SETGID) and ends such a child that hangs (KILL); nothing else.
CapabilityBoundingSet=CAP_DAC_OVERRIDE CAP_SETUID CAP_SETGID CAP_KILL
UMask=0022
