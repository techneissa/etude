name: Release

# A tag named v<major>.<minor>.<patch> builds the Raspberry Pi package and the Mac app, signs both
# with minisign and publishes them as a GitHub release, which is what the app's updater reads. The
# version is the project version in CMakeLists.txt; both builds stop when the tag differs from it.
#
# This runs on the public repository only: the guard on each job keeps it from running anywhere else.
#
# Four jobs, so that the signing key is never in a job that runs code built from downloaded sources:
#   build      no secrets: compiles, packs the Pi tarball, runs the built app once for its version
#   build-mac  no secrets: compiles on a Mac runner, makes etude.app (arm64), signs it ad hoc
#              (`codesign -s -`, no developer account), zips it with ditto and writes release-macos.json
#              (scripts/release-pack-mac.sh)
#   sign       the only job with the secrets: checks each file's SHA-256 and signs the tarball and the zip
#              with minisign, the same key and step; it runs sha256sum and minisign
#              (scripts/release-sign.sh) and nothing that was built
#   publish    the only job that can write to the repository: creates the GitHub release
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   MINISIGN_SECRET_KEY       the contents of the secret key file `minisign -G` wrote (two lines)
#   MINISIGN_PASSWORD         its password; leave it unset for a key made without one (minisign -G -W)
# The public half of that key is in core/src/update_key.cpp, and the sign job refuses to sign while
# that is still a placeholder or another key.
on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build and pack
    if: github.repository == 'techneissa/etude'
    # ubuntu-24.04-arm is arm64 like the Raspberry Pi 5. The build itself runs in a container of the
    # Debian release Raspberry Pi OS is based on (13, trixie: setup.sh builds with its CMake, and the
    # project needs a CMake newer than the one in Debian 12): built on Ubuntu 24.04 the binary would
    # need a newer glibc than the Pi has and not start there. It runs on this release and newer ones.
    # To move to a newer base, change the image (the digest is the multi-architecture one).
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie@sha256:913f6706df59a68922d1dd08f78c2476560a8d367897200a6005b00e5f67c2d5
    timeout-minutes: 90
    steps:
      - name: Check the tag
        # First, so a tag that is not a release version stops the run before any work.
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the tag $TAG is not v<major>.<minor>.<patch>"; exit 1; }

      - name: Install packages
        # setup.sh's build packages, plus git for the checkout and python3 for the piano samples.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git python3 \
            build-essential cmake ninja-build pkg-config ca-certificates \
            libasound2-dev libudev-dev \
            libdrm-dev libgbm-dev libegl-dev libgles-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libdecor-0-dev libcurl4-openssl-dev

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and pack
        # No secrets in this job: it compiles code that was downloaded.
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-pack.sh --expect-version "${TAG#v}"

      - name: Keep the files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            build/release/*.tar.gz
            build/release/*.tar.gz.sha256
            build/release/release.json
          if-no-files-found: error

  build-mac:
    name: Build and pack the Mac app
    if: github.repository == 'techneissa/etude'
    # macos-15 is arm64 (Apple silicon), the one Mac architecture released.
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check the tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the tag $TAG is not v<major>.<minor>.<patch>"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build tools
        run: brew install cmake ninja

      - name: Build and pack
        # No secrets in this job: it compiles code that was downloaded.
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/release-pack-mac.sh --expect-version "${TAG#v}"

      - name: Keep the files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files-mac
          path: |
            build/release-mac/*.zip
            build/release-mac/*.zip.sha256
            build/release-mac/release-macos.json
          if-no-files-found: error

  sign:
    name: Sign
    if: github.repository == 'techneissa/etude'
    needs: [build, build-mac]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files-mac
          path: release

      - name: Install minisign
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign

      - name: Sign
        # Checks each file's SHA-256, signs it, and checks the signature against the key in the source:
        # the Pi's tarball (release.json) and the Mac's zip (release-macos.json). No built code runs here.
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          test -n "$MINISIGN_SECRET_KEY" || { echo "::error::the repository secret MINISIGN_SECRET_KEY is not set"; exit 1; }
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          scripts/release-sign.sh release "$key"
          scripts/release-sign.sh release "$key" --info release-macos.json

      - name: Keep the signed files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-signed
          path: |
            release/*.tar.gz
            release/*.tar.gz.sha256
            release/*.tar.gz.minisig
            release/release.json
            release/*.zip
            release/*.zip.sha256
            release/*.zip.minisig
            release/release-macos.json
          if-no-files-found: error

  publish:
    name: Publish the release
    if: github.repository == 'techneissa/etude'
    needs: sign
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-signed
          path: release

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "etude ${TAG#v}" \
            --generate-notes
