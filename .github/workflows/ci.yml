name: CI

# One run per change. Every publish goes to staging first and main moves to the same commit only
# after that run is green, so a push to main would repeat it.
# - A pull request builds and runs the unit tests on Linux x64 only.
# - A push to staging and a manual run (`gh workflow run CI --ref <branch>`, also for a trial
#   branch) build the app, the tools and the tests in full on both Linux systems.
# - macOS runs only in the scheduled run (ci-schedule.yml) and in a manual run with `macos` on: the
#   app is built for the Raspberry Pi, and a Mac is a local test machine. The release builds the
#   Mac app; this CI does not gate on it.
on:
  push:
    branches: [staging]
  pull_request:
  workflow_dispatch:
    inputs:
      macos:
        description: Build on macOS too
        type: boolean
        default: false
  # The scheduled run (ci-schedule.yml) calls this workflow.
  workflow_call:
    inputs:
      macos:
        description: Build on macOS too
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # A change to notes, the licence or the README pictures cannot change the build or a test: the
  # run still exists and is green, so the promotion to main finds it, but no system builds.
  changes:
    name: Changed files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      matrix: ${{ steps.diff.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Look for code changes
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          MACOS: ${{ inputs.macos }}
        # A push to staging compares with main, the last commit that passed, not with the previous
        # staging commit: that one may have failed, and a docs-only commit on top must not hide it.
        run: |
          code=true
          base=""
          if [ "$EVENT" = push ] && git fetch --no-tags --depth=1 origin main; then
            base=$(git rev-parse FETCH_HEAD)
          elif [ "$EVENT" = pull_request ] && git fetch --no-tags --depth=1 origin "$PR_BASE"; then
            base="$PR_BASE"
          fi
          # No base (a manual run, a first publish) or one that cannot be fetched: build.
          if [ -n "$base" ]; then
            others=$(git diff --name-only "$base" HEAD |
              grep -v -E '^([^/]+\.md|LICENSE|docs-public/.*|\.github/(FUNDING|dependabot)\.yml)$' || true)
            [ -n "$others" ] || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "build: $code"

          # ubuntu-24.04-arm is arm64 like the Raspberry Pi 5. A pull request builds only the
          # unit tests (no app, no tools), which needs no SDL3 or Verovio.
          if [ "$EVENT" = pull_request ]; then
            matrix='{"include":[{"os":"ubuntu-24.04","tests_only":true}]}'
          else
            matrix='{"include":[{"os":"ubuntu-24.04-arm"},{"os":"ubuntu-24.04"}'
            [ "$MACOS" = true ] && matrix="$matrix"',{"os":"macos-26"}'
            matrix="$matrix"']}'
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "matrix: $matrix"

  build:
    name: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      # The systems for this event, from the changes job. macos-26 is needed: macos-15 cannot
      # build the code.
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    # A cold build takes up to 25 minutes; a hung test must not hold the run for six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux packages
        if: runner.os == 'Linux'
        # ALSA for MIDI, and the DRM/GBM/EGL/GLES stack SDL3 uses on the Pi without a desktop.
        run: |
          sudo apt-get update -o Acquire::Languages=none
          sudo apt-get install -y --no-install-recommends \
            ninja-build ccache libasound2-dev libudev-dev \
            libdrm-dev libgbm-dev libegl-dev libgles-dev \
            libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev \
            libxss-dev libxtst-dev libwayland-dev libxkbcommon-dev wayland-protocols \
            libdecor-0-dev libcurl4-openssl-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: brew install ninja ccache

      - name: Cache dependency downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/etude/downloads
          key: deps-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: deps-

      # ccache keeps the compiled objects between runs: a run compiles only what changed. Every
      # push saves its own copy under a new key and starts from the newest one of its runner image
      # (a branch reads its own caches and main's; the scheduled run keeps main's fresh). The key
      # names the image, so a cache from another macOS or compiler version is never restored. The
      # check is the compiler's content, not its time. A pull request saves nothing: its cache
      # could only be read by a re-run of the same pull request.
      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.os }}-

      - name: Configure ccache
        run: |
          {
            echo "CCACHE_DIR=$HOME/.ccache"
            echo "CCACHE_MAXSIZE=1G"
            echo "CCACHE_COMPILERCHECK=content"
          } >> "$GITHUB_ENV"

      - name: Configure
        env:
          TESTS_ONLY: ${{ matrix.tests_only }}
        run: |
          args=()
          [ "$TESTS_ONLY" = true ] && args=(-DETUDE_BUILD_APP=OFF -DETUDE_BUILD_TOOLS=OFF)
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DETUDE_PIANO_FROM_SOURCE=OFF "${args[@]}"

      - name: Build
        id: build
        env:
          TESTS_ONLY: ${{ matrix.tests_only }}
        run: |
          target=()
          [ "$TESTS_ONLY" = true ] && target=(--target etude_tests)
          ccache --zero-stats
          cmake --build build "${target[@]}" -- -k 0

      - name: ccache statistics
        if: always()
        # -vv lists why each miss missed.
        run: ccache --show-stats -vv

      - name: Save ccache
        # Only after a good build: a failed or cancelled one leaves a partial cache.
        if: steps.build.outcome == 'success' && github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.os }}-${{ github.sha }}

      - name: Test
        timeout-minutes: 15
        run: ctest --test-dir build --output-on-failure --timeout 600
